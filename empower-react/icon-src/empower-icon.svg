<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Em~power app icon — a bold crescent (cycle / lunar rhythm) with a rising gold disc. -->
  <!-- Warm editorial earth-tones own a lane no cycle app occupies. Two shapes, high contrast, -->
  <!-- legible at 40px, no text, no anatomy cliché, no transparency, square (iOS masks it). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f5"/>
      <stop offset="1" stop-color="#efe7db"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37312a"/>
      <stop offset="1" stop-color="#2c2820"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8caac"/>
      <stop offset="1" stop-color="#c3b291"/>
    </linearGradient>
    <!-- Crescent = big disc minus an offset disc -->
    <mask id="crescent">
      <circle cx="470" cy="540" r="300" fill="#fff"/>
      <circle cx="610" cy="430" r="292" fill="#000"/>
    </mask>
  </defs>

  <!-- Opaque warm background (do not pre-round corners; iOS applies the mask) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- The crescent: a confident moon opening toward the upper right -->
  <circle cx="470" cy="540" r="300" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- The rising gold disc, cradled in the crescent's opening -->
  <circle cx="648" cy="392" r="86" fill="url(#disc)"/>
</svg>
